<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ทะเบียนอุปกรณ์สำนักงาน</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <nav class="site-nav" aria-label="เมนูหลัก">
        <a href="dashboard.html">แดชบอร์ด</a>
        <a class="active" href="index.html">ทะเบียนปริ้นเตอร์</a>
      </nav>
      <header class="hero">
        <div>
          <h1>ทะเบียนปริ้นเตอร์ทั้งหมด</h1>
          <p class="intro">ติดตามเครื่องพิมพ์และสแกนเนอร์ พร้อมข้อมูลหมึก ตำแหน่ง และครุภัณฑ์</p>
          <p class="sync-status" id="syncStatus">กำลังเชื่อมต่อข้อมูลจาก Google Sheets…</p>
        </div>
        <div class="summary" aria-label="สรุปรายการ">
          <span>จำนวนรายการ</span>
          <strong id="totalCount">0</strong>
        </div>
      </header>

      <section class="table-card">
        <div class="table-heading">
          <div>
            <h2>รายการอุปกรณ์</h2>
            <p id="resultText">กำลังแสดงรายการ</p>
          </div>
          <div class="table-search">
            <input id="searchInput" type="search" placeholder="ค้นหาทุกหัวข้อ" aria-label="ค้นหาทุกหัวข้อ" />
            <button id="clearFilters" type="button">ล้างตัวกรอง</button>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <colgroup>
              <col class="col-building" /><col class="col-floor" /><col class="col-department" /><col class="col-model" />
              <col class="col-ink" /><col class="col-location" /><col class="col-asset" /><col class="col-note" />
            </colgroup>
            <thead>
              <tr>
                <th><span>ตึก</span><select id="buildingFilter" aria-label="กรองตึก"><option value="">ทุกตึก</option></select></th>
                <th><span>ชั้น</span><select id="floorFilter" aria-label="กรองชั้น"><option value="">ทุกชั้น</option></select></th>
                <th><span>แผนก</span><select id="departmentFilter" aria-label="กรองแผนก"><option value="">ทุกแผนก</option></select></th>
                <th><span>รุ่น-ยี่ห้อ</span><select id="modelFilter" aria-label="กรองรุ่น-ยี่ห้อ"><option value="">ทุกรุ่น</option></select></th>
                <th>หมึก</th><th>ตำแหน่ง</th>
                <th><span>ครุภัณฑ์/ID</span><input id="assetFilter" type="search" placeholder="ค้นหา ID" aria-label="กรองครุภัณฑ์หรือ ID" /></th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody id="inventoryBody"></tbody>
          </table>
        </div>
        <p class="empty-state" id="emptyState" hidden>ไม่พบรายการที่ตรงกับเงื่อนไข</p>
        <nav class="pagination" id="pagination" aria-label="เปลี่ยนหน้ารายการ">
          <button class="page-button" id="prevPage" type="button">ก่อนหน้า</button>
          <span id="pageLabel"></span>
          <button class="page-button" id="nextPage" type="button">ถัดไป</button>
        </nav>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
